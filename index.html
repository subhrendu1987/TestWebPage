<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Google Auth Demo</title>

    <script src="https://accounts.google.com/gsi/client"
            async defer></script>
</head>

<body>

<h2>Google Authentication Demo</h2>

<div id="google-login"></div>

<div id="user-info" style="display:none;">
    <p>
        Signed in as:
        <strong id="user-email"></strong>
    </p>

    <button onclick="sendData()">
        Send Data to Google Sheet
    </button>

    <pre id="result"></pre>
</div>


<script>

const GOOGLE_CLIENT_ID =
    "873564791429-lde895vap8vat147sn7ankh20coq67ht.apps.googleusercontent.com";

const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbwHoRq5ZZCRk9iMw9BrjQN_Jk-65n_vygegCuG1sVnsvKA_WqZ9piioTGnyYEkduoxItA/exec";

let googleCredential = null;


/*
 * Google Sign-In
 */
window.onload = function () {

    google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleGoogleLogin
    });

    google.accounts.id.renderButton(
        document.getElementById("google-login"),
        {
            theme: "outline",
            size: "large"
        }
    );
};


/*
 * Called after successful Google authentication
 */
function handleGoogleLogin(response) {

    /*
     * This is the Google ID token (JWT).
     *
     * DO NOT simply trust decoded values here.
     * The backend must verify the token.
     */
    googleCredential = response.credential;

    /*
     * Decode only for displaying information.
     * This is NOT authentication.
     */
    const payload = JSON.parse(
        atob(
            googleCredential.split(".")[1]
                .replace(/-/g, "+")
                .replace(/_/g, "/")
        )
    );

    document.getElementById("user-email").textContent =
        payload.email;

    document.getElementById("google-login").style.display =
        "none";

    document.getElementById("user-info").style.display =
        "block";
}


/*
 * Send data to Apps Script
 */
async function sendData() {

    if (!googleCredential) {
        alert("Please sign in first.");
        return;
    }

    const data = {
        action: "attendance",
        roll: "102345",
        course: "CSE123",
        status: "PRESENT"
    };

    const response = await fetch(APPS_SCRIPT_URL, {

        method: "POST",

        headers: {
            "Content-Type": "text/plain"
        },

        body: JSON.stringify({

            /*
             * Google ID token
             */
            credential: googleCredential,

            /*
             * Application data
             */
            data: data
        })
    });

    const result = await response.json();

    document.getElementById("result").textContent =
        JSON.stringify(result, null, 2);
}

</script>

</body>
</html>
