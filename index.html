<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Auth Demo</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<h2>Google Authentication Demo</h2>

<div id="google-login"></div>

<div id="user-info" style="display:none;">
    <p>
        Signed in as:
        <strong id="user-email"></strong>
    </p>

    <button onclick="sendData()">
        Send Data to Google Sheet
    </button>

    <pre id="result"></pre>
</div>

<script>
const GOOGLE_CLIENT_ID =
    "873564791429-3f0dlpnc5tma0o9467p9m7kqcm597qc3.apps.googleusercontent.com";

const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbx2xZOok3Rc-v2R4Cb2BICY095D8FLVmXPlfxMDeqZwLiKRaGnmlIjIBg6LAT_M5oKkGg/exec";

let googleCredential = null;

/*
 * Initialize Google Sign-In
 */
window.onload = function () {
    google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleGoogleLogin
    });

    google.accounts.id.renderButton(
        document.getElementById("google-login"),
        {
            theme: "outline",
            size: "large"
        }
    );
};

/*
 * Called after successful Google authentication
 */
function handleGoogleLogin(response) {
    googleCredential = response.credential;

    try {
        // Safe UTF-8 JWT Payload Decoder
        const base64Url = googleCredential.split(".")[1];
        const base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/");
        const jsonPayload = decodeURIComponent(
            atob(base64)
                .split("")
                .map(c => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2))
                .join("")
        );
        const payload = JSON.parse(jsonPayload);

        document.getElementById("user-email").textContent = payload.email;
        document.getElementById("google-login").style.display = "none";
        document.getElementById("user-info").style.display = "block";

    } catch (err) {
        console.error("Error parsing JWT:", err);
        alert("Failed to read user authentication details.");
    }
}

/*
 * Send data to Apps Script backend
 */
async function sendData() {
    const resultElement = document.getElementById("result");

    if (!googleCredential) {
        alert("Please sign in first.");
        return;
    }

    resultElement.textContent = "Sending request to Google Apps Script...";

    const dataPayload = {
        action: "attendance",
        roll: "102345",
        course: "CSE123",
        status: "PRESENT"
    };

    try {
        const response = await fetch(APPS_SCRIPT_URL, {
            method: "POST",
            method: "POST",
            redirect: "follow", // Ensures Google Apps Script 302 redirects are followed
            headers: {
                "Content-Type": "text/plain;charset=utf-8" // Avoids preflight CORS issues
            },
            body: JSON.stringify({
                credential: googleCredential,
                data: dataPayload
            })
        });

        const result = await response.json();
        resultElement.textContent = JSON.stringify(result, null, 2);

    } catch (error) {
        console.error("Error posting to Apps Script:", error);
        resultElement.textContent = JSON.stringify({
            success: false,
            error: "Failed to connect to Apps Script endpoint: " + error.toString()
        }, null, 2);
    }
}
</script>

</body>
</html>
